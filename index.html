<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>สวัสดีวันจันทร์ | CR7</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600;700&family=Prompt:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="stars"></div>
<main class="card">
  <div class="topline"><span>⚽ CR7</span><span id="date"></span></div>
  <section class="hero">
    <div class="copy">
      <div class="badge">MONDAY • GOOD VIBES</div>
      <h1>สวัสดีวันจันทร์ 👋</h1>
      <h2>เริ่มต้นสัปดาห์ใหม่<br><span>ด้วยพลังแบบแชมป์</span></h2>
      <p>ขอให้วันนี้เต็มไปด้วยพลังบวก ความสำเร็จ และเรื่องดี ๆ<br>ลุยให้สุด แล้วอย่ายอมแพ้ 💪</p>
      <button id="wishBtn">✨ รับคำอวยพร</button>
    </div>
    <div class="player-wrap">
      <div class="glow"></div>
      <div class="photo-card">
        <img src="https://live.staticflickr.com/2598/4199912028_2ab113ebb9_o.jpg" alt="Cristiano Ronaldo">
        <div class="wave">👋</div>
      </div>
      <div class="name">CRISTIANO<br><strong>RONALDO</strong></div>
    </div>
  </section>
  <div class="quote" id="quote">“เริ่มวันใหม่ด้วยความมุ่งมั่น แล้วทำให้วันนี้ดีที่สุด”</div>
  <footer>
    <span>Made for a bright Monday</span>
    <a href="https://www.cristianoronaldo.com/" target="_blank" rel="noreferrer">CR7 Official Website ↗</a>
  </footer>
</main>
<script src="script.js"></script>
</body>
</html>
